# Ours (governedwork fork), not upstream GBrain: the fork's full suite on Linux.
#
# Upstream's Test workflow runs on Ubicloud runners and only for master; the fork has neither. Its lander (on the
# wardrobe, a macOS sandbox) gates each PR with the typecheck and the tests it names, but the whole suite assumes Linux
# (flock(1), case-sensitive paths, process groups, ps), so on macOS it is red on bare upstream too. This workflow runs
# the same suite on GitHub's free Linux runners (the fork is public), with upstream's own shard scripts, and
# `fork-suite` is the context the brains-v* ruleset requires beside `lander/verdict` (operator ruling 2026-10-19,
# arc gbrain-bump).
#
# Shard counts are read from upstream's own constants (UNIT_SHARDS in scripts/sharding.ts, ARM_SHARDS in
# scripts/postgres-unit-arms.ts) by the `plan` job, so a rebase that re-weights upstream's lanes cannot leave this
# matrix splitting the suite differently from the weights it was packed for. The serial lane keeps upstream's 4
# (test.yml `serial-tests`, a literal there too).
#
# Lanes: the unit and serial shards; postgres-e2e (8 shards of scripts/run-e2e.sh against a pgvector pg16 service;
# scripts/e2e-live-key-only.txt files skip, scripts/e2e-backend-matrix.txt files get their direct pass only,
# scripts/fork-e2e-exclusions.txt files — fork divergences, each with its reason — not at all); postgres-arms.
# The heavy files scripts/test-shard.sh excludes, which upstream runs in dedicated jobs, run in none of them.
# A red unit shard goes to scripts/fork-retry-known-flakes.ts with its JUnit receipts and log: it stays red on any error
# outside a test, any failure not listed in scripts/fork-known-flakes.txt, or receipts naming no failed test; a listed
# failure is re-run once, alone, and counts only if its own JUnit report shows it passed (annotated ::warning::).
# Pinned by test/fork-suite-workflow.test.ts.
name: fork-suite

on:
  pull_request:
    branches: ['brains-v*']
  push:
    branches: ['brains-v*']
  workflow_dispatch:

concurrency:
  group: fork-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.4'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.counts.outputs.unit }}
      unit_total: ${{ steps.counts.outputs.unit_total }}
      arms: ${{ steps.counts.outputs.arms }}
      arms_total: ${{ steps.counts.outputs.arms_total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: counts
        run: |
          # shellcheck disable=SC2016 # the single quotes keep the TypeScript's template literals from the shell
          bun -e '
            const { UNIT_SHARDS } = await import("./scripts/sharding.ts");
            const { ARM_SHARDS } = await import("./scripts/postgres-unit-arms.ts");
            for (const [k, n] of [["unit", UNIT_SHARDS], ["arms", ARM_SHARDS]]) {
              if (!Number.isInteger(n) || n < 1) { console.error(`${k} shard count is not a positive integer: ${n}`); process.exit(1); }
              console.log(`${k}=${JSON.stringify(Array.from({ length: n }, (_, i) => i + 1))}`);
              console.log(`${k}_total=${n}`);
            }' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  unit:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile
      - name: Unit shard ${{ matrix.shard }}/${{ needs.plan.outputs.unit_total }}
        env:
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: |
          set -o pipefail
          bash scripts/test-shard.sh ${{ matrix.shard }} ${{ needs.plan.outputs.unit_total }} 2>&1 | tee "$RUNNER_TEMP/unit-shard.log" || bun scripts/fork-retry-known-flakes.ts "$GBRAIN_TEST_RECEIPT_DIR" "$RUNNER_TEMP/unit-shard.log"

  serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile
      - name: Serial shard ${{ matrix.shard }}/4
        run: bun run test:serial
        env:
          SHARD: ${{ matrix.shard }}/4

  # Upstream's E2E corpus against PostgreSQL + pgvector, sequential per file (scripts/run-e2e.sh). Upstream runs it in
  # e2e.yml's diff-selected and nightly full-corpus lanes on Ubicloud; the fork runs the whole corpus on every PR.
  postgres-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --shm-size=1g
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile
      - name: E2E shard ${{ matrix.shard }}/8
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gbrain_test
          SHARD: ${{ matrix.shard }}/8
        # The default corpus minus the fork's reasoned exclusions (scripts/fork-e2e-exclusions.txt); run-e2e.sh shards
        # an explicit list the same way.
        run: |
          mapfile -t files < <(SHARD='' bash scripts/run-e2e.sh --dry-run-list | grep -vxF -f <(grep -v '^#' scripts/fork-e2e-exclusions.txt | cut -f1))
          bash scripts/run-e2e.sh "${files[@]}"

  # The PostgreSQL arms of unit-lane suites (test/postgres-unit-arms.txt), as upstream's persistence-validation
  # `unit-postgres-arms` runs them: two workers per shard, each against its own service. The unit shards run only the
  # PGLite side, and several fork features (takes, rename, packs) carry Postgres arms the lander's Mac cannot run.
  postgres-arms:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.arms) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres2:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - name: PostgreSQL arms shard ${{ matrix.shard }}/${{ needs.plan.outputs.arms_total }}
        timeout-minutes: 30
        env:
          GBRAIN_ARM_DATABASE_URLS: >-
            postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
            postgres://gbrain_test:gbrain_test@127.0.0.1:5433/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
        run: bun scripts/postgres-unit-arms.ts run ${{ matrix.shard }} ${{ needs.plan.outputs.arms_total }}

  # The one required context: green only when the plan and every unit, serial, E2E and PostgreSQL-arm shard passed.
  fork-suite:
    if: always()
    needs: [plan, unit, serial, postgres-e2e, postgres-arms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "plan: ${{ needs.plan.result }}  unit: ${{ needs.unit.result }}  serial: ${{ needs.serial.result }}  postgres-e2e: ${{ needs.postgres-e2e.result }}  postgres-arms: ${{ needs.postgres-arms.result }}"
          test "${{ needs.plan.result }}" = success && test "${{ needs.unit.result }}" = success && test "${{ needs.serial.result }}" = success \
            && test "${{ needs.postgres-e2e.result }}" = success && test "${{ needs.postgres-arms.result }}" = success
