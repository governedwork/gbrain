# Ours (governedwork fork), not upstream GBrain: the fork's whole suite once a night, as an alarm, on
# governedwork/lander's shared nightly recipe (vendored beside this file; never edit it). What runs:
# scripts/nightly.sh. A red opens or rewrites the one `nightly-red` issue; nothing waits for it.
name: nightly

on:
  schedule: [{ cron: "23 0 * * *" }]
  workflow_dispatch:

permissions: { contents: write, issues: write }

jobs:
  nightly:
    uses: ./.github/workflows/nightly-recipe.yml
    secrets: inherit
    with:
      command: bash scripts/nightly.sh
      runner: ${{ vars.CI_RUNNER_LARGE || 'wardrobe-large' }}
      timeout-minutes: 360
